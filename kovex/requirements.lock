# Versions figées de l'exécution — les seules que la suite de tests a réellement
# exécutées.
#
# `requirements.txt` ne pose que des bornes basses : il décrit ce que le code
# exige, et convient au développement. Il ne convient pas à une installation.
# Une résolution faite aujourd'hui à partir de ces bornes ramène reportlab 5.x
# et starlette 1.6 — deux montées de version majeure qu'aucun test n'a jamais
# exercées. Sur un serveur isolé, où l'on installe une fois à partir d'un
# miroir, l'écart ne se découvre qu'en production.
#
# Installation d'un serveur :
#
#     pip install -r requirements.lock
#
# Régénération, après avoir mis à jour une borne dans `requirements.txt` et
# vérifié que toute la suite passe :
#
#     python outils_verrou.py --ecrire
#
# Trois entrées dépendent de la plateforme, et toutes ne s'installent pas
# partout : `uvloop` hors Windows, `colorama` et `tzdata` sous Windows.
# `pandas` n'exige `tzdata` que sur Windows, où le système ne fournit pas de
# base de fuseaux horaires ; relevé sous Linux, le verrou l'ignorait, et `pip`
# en choisissait librement la version sur le poste cible. Ces deux lignes sont
# les seules que la suite n'exécute pas — elles ne s'installent pas sur la
# plateforme qui la fait tourner. Un verrou entièrement clos se régénère sur la
# plateforme cible.
#
# `requirements-dev.txt` n'est pas figé : l'outillage de test ne part pas chez
# le client.

